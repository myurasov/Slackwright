[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "slackwright"
version = "0.2.0"
description = "Browser-driven Slack message extractor that bypasses Slack-bot scope limits by using the user's own logged-in web session."
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [{ name = "Mikhail Yurasov" }]
requires-python = ">=3.10"
keywords = ["slack", "scraper", "playwright", "extractor", "archive", "search"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Communications :: Chat",
    "Topic :: Office/Business",
    "Topic :: Utilities",
]
dependencies = [
    "playwright>=1.41,<2.0",
    "PyYAML>=6.0",
    "httpx>=0.27,<1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
]

[project.scripts]
slackwright = "slackwright.cli:main"

[project.urls]
Homepage = "https://github.com/myurasov/Slackwright"
Repository = "https://github.com/myurasov/Slackwright"
Issues = "https://github.com/myurasov/Slackwright/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/slackwright"]

[tool.hatch.build.targets.sdist]
include = ["src/slackwright", "README.md", "LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra -q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["E501"]
